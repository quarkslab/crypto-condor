syntax = "proto3";

package crypto_condor;

message MldsaTest{
	// The test ID, unique in its set of vectors.
	int32 id = 1;
	// The type of test. One of: valid, invalid, acceptable.
	string type = 2;
	// A comment on the test.
	string comment = 3;
	// Flags that categorize this test.
	repeated string flags = 4;

	// The message to sign.
	bytes msg = 5;
	// The public key.
	bytes pk = 6;
	// The secret key.
	bytes sk = 7;
	// The signature.
	bytes sig = 8;
	// The context string.
	bytes ctx = 9;
	// The seed for key generation (32 bytes).
	bytes seed = 10;
	// The randomness used for signing (32 bytes). 00*32 for deterministic signing.
	bytes rnd = 11;
	// Whether signing is deterministic.
	bool deterministic = 12;
	// Whether this is a pre-hash variant.
	bool preHash = 13;
	// The signature interface: "external" or "internal".
	string signatureInterface = 14;
	// Whether external message input is used.
	bool externalMu = 15;
	// The hash algorithm for prehash mode (e.g. "SHA2-512"). Empty for pure mode.
	string hashAlg = 16;
}

// A set of ML-DSA test vectors.
message MldsaVectors{
	// The source of the test vectors.
	string source = 1;
	// Description of the source.
	string source_desc = 2;
	// The URL of the source.
	string source_url = 3;
	// Whether these are compliance test vectors or not.
	bool compliance = 4;
	// A dictionary of test flags and their description.
	map<string, string> notes = 5;

	// The ML-DSA parameter set.
	string paramset = 6;
	// The test vectors.
	repeated MldsaTest tests = 7;

	// The test category: "keyGen", "sigGen", or "sigVer".
	string category = 8;
	// Whether these vectors are for the prehash variant.
	bool prehash = 9;
}
